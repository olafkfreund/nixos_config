name: Update Flake Inputs

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Our own binary cache. magic-nix-cache was retired by Determinate
      # Systems and now fails the job outright with "Cache service responded
      # with 400" / "Our services aren't available right now".
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: olafkfreund
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: nix-community

      - name: Update flake inputs
        id: update
        run: |
          echo "Updating flake inputs..."

          nix flake update

          # git is the copy of the old lock — the previous `cp flake.lock
          # flake.lock.old` left its scratch file in the tree and
          # create-pull-request committed it alongside the real change (#1495).
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No updates available"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updates found"
            git --no-pager diff -- flake.lock
          fi

      # Evaluate, do not build. Building three full system closures on a
      # 14GB ubuntu-latest runner is what made every scheduled run of this
      # workflow fail from 2026-05-20 to 2026-08-27 — 91 failures, zero
      # successes, so a flake PR was never once opened. Eval catches what a
      # lock bump actually breaks (removed options, renamed attributes,
      # changed module interfaces) in about a minute and needs no disk. This
      # is the same check ci.yml runs, and ci.yml does not run on a
      # GITHUB_TOKEN pull request, so this step is the only gate there is.
      - name: Validate configurations
        if: steps.update.outputs.changed == 'true'
        run: |
          set +e
          rc=0
          for host in p620 razer p510; do
            echo "Validating $host..."
            err=$(nix eval --no-update-lock-file --show-trace \
              .#nixosConfigurations.$host.config.system.build.toplevel.outPath 2>&1)
            hrc=$?
            echo "$err"
            if [ $hrc -eq 0 ]; then
              echo "PASS: $host"
              continue
            fi
            # Same carve-out as ci.yml: the nix-openclaw-tools sub-flake
            # pins itself with path:../.., which nix refuses to lock. The
            # host evaluated cleanly up to the plugin loader.
            if echo "$err" | grep -qE 'lock file contains unlocked input.*"path":"\.\./\.\."'; then
              echo "::warning::Known upstream path:../.. issue in nix-openclaw-tools; treating $host as PASS."
              continue
            fi
            echo "ERROR: $host does not evaluate with the updated lock"
            rc=1
          done
          exit $rc

      - name: Generate update summary
        if: steps.update.outputs.changed == 'true'
        id: summary
        run: |
          echo "Generating update summary..."

          # Extract updated inputs from flake.lock diff
          summary=$(nix flake metadata --json | jq -r '
            .locks.nodes |
            to_entries[] |
            select(.value.locked.type != null) |
            "- **\(.key)**: \(.value.locked.rev // .value.locked.narHash // "updated")[0:7]"
          ' | head -20)

          # Save to output
          {
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update flake inputs - daily automatic update'
          title: 'chore(deps): daily flake input updates'
          body: |
            ## Automated Daily Flake Update

            This PR updates all flake inputs to their latest versions.

            ### Updated Inputs

            ${{ steps.summary.outputs.summary }}

            ### Testing Status

            All three host configurations evaluate with the updated lock
            (p620, razer, p510). Evaluated, not built — a green run here means
            nothing was renamed or removed out from under us, not that every
            package compiles.

            ### Review Checklist

            - [ ] Check flake.lock changes
            - [ ] Review any breaking changes in changelogs
            - [ ] Test on at least one host before merging
            - [ ] Verify all services still work after update

            ### Deployment

            After merge, deploy with:
            ```bash
            just quick-deploy HOST
            ```

            Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: chore/flake-update-daily
          delete-branch: true
          labels: |
            dependencies
            automated
          assignees: olafkfreund
          draft: false

      - name: Auto-merge if CI passes
        if: steps.update.outputs.changed == 'true'
        run: |
          echo "INFO: Pull request created successfully"
          echo "INFO: Review and merge after CI checks pass"
          echo "INFO: The PR is assigned to you for review"

      - name: Report no updates
        if: steps.update.outputs.changed == 'false'
        run: |
          echo "INFO: No flake updates available today"
          echo "INFO: All inputs are already at latest versions"
