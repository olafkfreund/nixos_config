# SOPS configuration for NixOS secrets management
# This file defines encryption keys and rules for secret files

keys:
  # Admin/User keys
  - &olafkfreund age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p

  # Host keys, derived from each machine's own SSH host key:
  #   ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub        (on that host)
  #   ssh <host> cat /etc/ssh/ssh_host_ed25519_key.pub | ssh-to-age
  #
  # These were `age1yubikey1q...` placeholders until 2026-09-27 -- three
  # fabricated values sharing one tail. Nothing had been encrypted against
  # them, so nothing was lost, but the first secret that had been would have
  # failed at ACTIVATION on the target host rather than at encrypt time.
  - &p620 age1pfucr4w7a2jwcnujpdtvgsy3hu9axls5zn2qme60xvnw3xqha4cst87ppj
  - &razer age1cpxy9lxck894ht2266t6y34ccp745lpfm375j0wjl8dkzyn5wf7s0ehmcm
  - &p510 age1wkylnk4zh4rrkjg3rltuvqj42zcwjexcw7a5wueyq2qm490thy4qpvz2yt

# Group definitions for easier management
groups:
  - &admin_users
    - *olafkfreund

  - &all_hosts
    - *p620
    - *razer
    - *p510

  - &workstations
    - *p620
    - *razer

  - &servers
    - *p510

creation_rules:
  # Default rule: All secrets accessible by admin and all hosts
  - path_regex: secrets/common/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *olafkfreund
          - *p620
          - *razer
          - *p510

  # Host-specific secrets - only accessible by admin and specific host
  - path_regex: secrets/hosts/p620/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *olafkfreund
          - *p620

  - path_regex: secrets/hosts/razer/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *olafkfreund
          - *razer

  - path_regex: secrets/hosts/p510/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *olafkfreund
          - *p510

  # Binary files (for certificates, keys, etc.)
  - path_regex: secrets/[^/]+\.bin$
    key_groups:
      - age:
          - *olafkfreund
          - *p620
          - *razer
          - *p510
