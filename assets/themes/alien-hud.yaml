system: "base16"
name: "Alien HUD"
author: "olafkfreund (sampled from the Weyland-Yutani propulsion-monitor plates)"
variant: "dark"
# Values are measured off the reference plate, not eyeballed: the greys and the
# four accents below are the actual dominant colours of the engine-monitor
# render (ImageMagick histogram + point probes), which is why they are duller
# and warmer than a synthetic "terminal green" scheme.
#
# The plate only ever uses FOUR hues — green, orange, amber and a muted teal.
# base16 needs sixteen slots, and terminals genuinely use red/blue/magenta for
# ANSI output (diffs, ls, log levels), so base08/base0D/base0E are derived
# rather than sampled. They are kept at the plate's low saturation so they read
# as part of the same instrument panel while staying distinguishable.
#
# Body-text contrast on base00: base05 6.6:1, base0B 8.0:1, base0A 7.7:1 —
# all above WCAG AA. Don't darken base05 further without rechecking.
palette:
  base00: "#1d1f20" # background — darkest panel field
  base01: "#262829" # raised surface / the plate's page ground
  base02: "#3a443a" # selection — green-grey
  base03: "#4e5047" # hairline rules, dim separators, comments
  base04: "#706a5e" # dim label text
  base05: "#ada386" # foreground — the plate cream
  base06: "#b3af8f"
  base07: "#cfc9b2"
  base08: "#d2502a" # red — alarm (derived; the plate signals alarm in orange)
  base09: "#e8761a" # orange — reactor core, chamber-pressure trace
  base0A: "#dea92e" # amber — THROAT, SEQ box, LIFE bar
  base0B: "#8ec27c" # phosphor green — primary accent, active borders
  base0C: "#749287" # teal — coolant trace, MAG FIELD readout
  base0D: "#6b8794" # blue (derived from the coolest tone on the plate)
  base0E: "#9c8b93" # magenta (derived; the plate has none)
  base0F: "#6e5229" # brown — dimmed orange trace
